<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171009">
  <title>Medieval Online RP Thailand</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap');
    :root{--bg:#171009;--side:#21170d;--edge:#745329;--gold:#e2bd6b;--text:#f0dfbc;--muted:#bd9c62}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:'Noto Serif Thai',serif;background:var(--bg);color:var(--text);overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:210px 1fr}
    aside{background:linear-gradient(180deg,#2b1d0f,#171009);border-right:1px solid var(--edge);overflow-y:auto;padding:18px 9px 24px}
    .brand{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);font-weight:700;letter-spacing:.04em;text-align:center;font-size:.92rem;padding:0 5px 15px;border-bottom:1px solid rgba(226,189,107,.35);margin-bottom:10px}.brand img{display:block;width:100%;max-width:164px;height:auto;margin:0 auto 10px}.brand small{display:block;font-family:'Noto Serif Thai',serif;color:var(--muted);font-weight:400;font-size:.58rem;letter-spacing:.08em;margin-top:3px}
    nav{display:flex;flex-direction:column;gap:2px}.nav-link{width:100%;border:0;border-left:3px solid transparent;background:transparent;color:#dfcda8;text-align:left;padding:8px 9px;font:500 .78rem 'Noto Serif Thai',serif;cursor:pointer;border-radius:0 5px 5px 0;transition:.18s}.nav-link:hover,.nav-link.active{background:rgba(201,163,92,.16);border-left-color:var(--gold);color:#fff}.nav-group-head{display:flex;align-items:center}.nav-group-head .nav-link{flex:1}.nav-toggle{width:30px;border:0;background:transparent;color:var(--gold);cursor:pointer;font-size:.85rem;padding:7px 3px;transition:transform .2s}.nav-group.collapsed .nav-toggle{transform:rotate(-90deg)}.sub-pages{overflow:hidden;max-height:160px;transition:max-height .22s ease}.nav-group.collapsed .sub-pages{max-height:0}.sub{font-size:.72rem;padding-left:21px;color:#c7ad7b}.group{font:600 .7rem Cinzel,'Noto Serif Thai',serif;color:var(--muted);letter-spacing:.08em;padding:15px 12px 3px}
    main{min-width:0;position:relative;background:#111}.topbar{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(90deg,#23180d,#181108);border-bottom:1px solid var(--edge);color:var(--gold);font-family:Cinzel,'Noto Serif Thai',serif;font-size:.78rem;letter-spacing:.04em}.menu{display:none;background:none;border:1px solid var(--edge);color:var(--gold);font-size:1.25rem;border-radius:4px;padding:3px 9px;cursor:pointer}.content{height:calc(100% - 48px);overflow:auto;background:#16100a}.page-frame{width:100%;height:100%;border:0;display:block;background:#16100a}.gift-page{min-height:100%;padding:24px 18px 42px;background:radial-gradient(900px 460px at 10% 0,#3a2715 0,transparent 65%),#171009}.gift-head{max-width:760px;margin:0 auto 26px;text-align:center}.gift-head h1{font:700 1.45rem Cinzel,'Noto Serif Thai',serif;color:var(--gold);letter-spacing:.08em;margin:0 0 5px}.gift-head small{color:var(--muted);font:.58rem Cinzel,sans-serif;letter-spacing:.18em}.gift-info{max-width:680px;margin:15px auto 0;padding:16px 20px;background:linear-gradient(180deg,#ead9ad,#d9c394);color:#392919;border:3px double #8a6732;border-radius:4px;text-align:left;font-size:.77rem;line-height:1.7;box-shadow:0 8px 25px #0006}.gift-info h2{margin:0 0 6px;font-size:.9rem;color:#742a22}.gift-info p{margin:0}.gift-discord{display:inline-block;margin-top:12px;padding:7px 13px;background:#5865f2;color:#fff;text-decoration:none;border-radius:5px;font-size:.72rem;font-weight:700}.ticket-title{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);text-align:center;font-size:.9rem;letter-spacing:.08em;margin:0 0 13px}.gifts{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gift-card{overflow:hidden;background:linear-gradient(180deg,#2a1d11,#17110b);border:1px solid #745329;box-shadow:0 7px 18px #0007;border-radius:5px;color:#ead9b5;transition:transform .18s,border-color .18s}.gift-card:hover{transform:translateY(-4px);border-color:var(--gold)}.gift-card.coming{filter:saturate(.3);opacity:.78}.gift-image{height:138px;padding:7px;background:#100c08;border-bottom:1px solid #745329}.gift-image img{width:100%;height:100%;object-fit:cover;display:block}.gift-body{padding:11px 12px 12px}.gift-status{display:inline-block;color:#d7bb78;font:600 .52rem Cinzel,sans-serif;letter-spacing:.08em}.gift-name{margin:7px 0 3px;color:#e5bf6e;font:700 .83rem Cinzel,'Noto Serif Thai',serif}.gift-price{font:700 .78rem monospace;color:#f2dfaf}.gift-actions{display:flex;gap:7px;margin-top:10px}.gift-actions a,.gift-actions span{flex:1;text-align:center;padding:6px 4px;border:1px solid #836033;color:#e6cf99;text-decoration:none;font-size:.61rem}.gift-actions a{background:#6b4a26;color:#fff}.gift-card.coming .gift-actions a{pointer-events:none;background:#3a3026;color:#b4aa9a}
    .tk-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .tk-gem{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24b4b,#7a1f1f 65%,#2e0d0d 100%);border:1px solid #b8892b;box-shadow:0 0 5px rgba(210,75,75,.55);z-index:3}
    .tk-gem.tl{top:-5px;left:-5px}.tk-gem.tr{top:-5px;right:-5px}.tk-gem.bl{bottom:-5px;left:-5px}.tk-gem.br{bottom:-5px;right:-5px}
    .tk-card{position:relative;background:linear-gradient(180deg,#2b2015,#1c140d);border:1px solid #8a6520;border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .2s ease,box-shadow .2s ease,filter .25s ease}
    .tk-card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.6),0 0 0 1px rgba(184,137,43,.3),0 0 18px rgba(224,190,111,.25);border-color:#e0be6f}
    .tk-card.coming{filter:grayscale(.92) contrast(.88) brightness(.8)}
    .tk-card.coming:hover{transform:translateY(-3px);filter:grayscale(.8) contrast(.92) brightness(.88);box-shadow:0 12px 26px rgba(0,0,0,.5);border-color:#8a6520}
    .tk-card.coming .tk-gem{background:radial-gradient(circle at 35% 30%,#cfcfcf,#6b6b6b 65%,#1c1c1c 100%);border-color:#8a8a8a;box-shadow:0 0 5px rgba(120,120,120,.4)}
    .tk-media{position:relative;width:100%;aspect-ratio:4/3;background:#1c140d;overflow:hidden;border-bottom:1px solid #8a6520;padding:8px}
    .tk-media-inner{position:relative;width:100%;height:100%;border:1px solid #8a6520;overflow:hidden}
    .tk-media img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.03)}
    .tk-card.coming .tk-media img{filter:saturate(0) contrast(1) brightness(.95)}
    .tk-status{position:absolute;top:12px;left:12px;z-index:2;font-family:Cinzel,'Noto Serif Thai',serif;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .tk-tear{position:relative;height:0;border-top:1px dashed #8a6520;margin:0 18px}
    .tk-tear::before,.tk-tear::after{content:"";position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:#14100c;box-shadow:0 0 0 1px #8a6520 inset}
    .tk-tear::before{left:-25px}.tk-tear::after{right:-25px}
    .tk-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;position:relative}
    .tk-team-row{display:flex;align-items:center;gap:9px}
    .tk-badge{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#e0be6f,#8a6520 70%);color:#241a0f;border:2px solid #b8892b;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:11px;font-weight:700;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
    .tk-team{font-family:Cinzel,'Noto Serif Thai',serif;font-size:9.5px;color:#c2ac82;text-transform:uppercase;letter-spacing:1.3px}
    .tk-title{font-family:Cinzel,'Noto Serif Thai',serif;font-size:17px;font-weight:700;text-transform:uppercase;margin:2px 0 4px;color:#e0be6f;text-shadow:0 2px 0 rgba(0,0,0,.4)}
    .tk-price{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:#e0be6f}
    .tk-price .cur{color:#c2ac82;font-size:12px;margin-right:2px}
    .tk-actions{display:flex;gap:8px;margin-top:12px}
    .tk-buy{position:relative;flex:1.3;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;background:linear-gradient(180deg,#6b4a26,#452c16 55%,#38220f);border:1px solid #8a6520;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);color:#f0e4c6;font-family:Cinzel,serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease;text-decoration:none}
    .tk-buy:hover{filter:brightness(1.25)}
    .tk-card.coming .tk-buy{filter:grayscale(1);opacity:.45;pointer-events:none}
    .tk-outline{flex:1;background:transparent;color:#c2ac82;border:1px solid #8a6520;border-radius:4px;font-family:'Noto Serif Thai',serif;font-weight:600;font-size:11px;padding:0 8px;cursor:pointer;transition:background .15s ease,color .15s ease}
    .tk-outline:hover{background:rgba(184,137,43,.12);color:#e0be6f}
    .tk-overlay{position:fixed;inset:0;background:rgba(10,8,5,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
    .tk-overlay.open{display:flex}
    .tk-modal-frame{position:relative;width:100%;max-width:380px;background:linear-gradient(180deg,#2b2015,#1c140d);border:1px solid #8a6520;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
    .tk-modal{position:relative;border:1px solid #8a6520;padding:22px;max-height:80vh;overflow:auto}
    .tk-modal-eyebrow{font-family:Cinzel,serif;font-size:10px;letter-spacing:1.5px;color:#c2ac82;text-transform:uppercase}
    .tk-modal h2{font-family:Cinzel,'Noto Serif Thai',serif;text-transform:uppercase;margin:8px 0 12px;font-size:19px;color:#e0be6f}
    .tk-modal .tk-price{display:block;margin:6px 0 16px}
    .tk-modal p.tk-desc{color:#c2ac82;font-size:12.5px;line-height:1.75;margin:0 0 18px}
    .tk-modal .tk-outline{width:100%;height:36px}
    @media(max-width:760px){body{overflow:auto}.app{display:block}.menu{display:block}aside{position:fixed;z-index:5;left:0;top:0;bottom:0;width:210px;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px #000}body.menu-open aside{transform:translateX(0)}main{height:100vh}.topbar{height:48px}.content{height:calc(100vh - 48px)}.gift-page{padding:17px 12px}.gifts{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.gift-image{height:125px}.tk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}@media(max-width:430px){.gifts{grid-template-columns:1fr;max-width:280px}.tk-grid{grid-template-columns:1fr;max-width:320px}}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"><div class="brand"><img src="logo.png" alt="Medieval RP"><small>ROLEPLAY THAILAND</small></div><nav id="navigation"></nav></aside>
    <main><div class="topbar"><button class="menu" id="menu" aria-label="เปิดเมนู">☰</button><span id="pageTitle">HOME</span></div><div class="content" id="content"></div></main>
  </div>
  <script>
    const pages=[['home','HOME','HOME.html'],['about','ABOUT','ABOUT.html'],['rules','RULES','RULES.html'],['lore','SERVER LORE','SERVER LORE.html'],['ep1','เนื้อเรื่อง EP.1','EP1.html'],['ep2','เนื้อเรื่อง EP.2','EP2.html'],['ep3','เนื้อเรื่อง EP.3','EP3.html'],['guide','GUIDE','GUIDE.html'],['legend','เรื่องเล่า ตำนาน','เรื่องเล่า ตำนาน.html'],['roles','บทบาท','บทบาท.html'],['whitelist','Whitelist Registration','Whitelist Registration.html'],['gifting','GIFTING','GIFTING.html']];
    const nav=document.getElementById('navigation'),content=document.getElementById('content'),title=document.getElementById('pageTitle');
    const makeLink=([id,label])=>{const b=document.createElement('button');b.className='nav-link';b.dataset.id=id;b.textContent=label;b.onclick=()=>location.hash=id;return b};
    [['home'],['about'],['rules'],['lore',['ep1','ep2','ep3']],['guide',['legend','roles']],['whitelist'],['gifting']].forEach(([id,children])=>{const parent=pages.find(p=>p[0]===id);if(!children){nav.append(makeLink(parent));return}const group=document.createElement('div');group.className='nav-group collapsed';const head=document.createElement('div');head.className='nav-group-head';head.append(makeLink(parent));const toggle=document.createElement('button');toggle.className='nav-toggle';toggle.textContent='⌄';toggle.setAttribute('aria-label','เปิด/ปิดหน้าย่อย');toggle.onclick=()=>group.classList.toggle('collapsed');head.append(toggle);const sub=document.createElement('div');sub.className='sub-pages';children.forEach(child=>{const link=makeLink(pages.find(p=>p[0]===child));link.classList.add('sub');sub.append(link)});group.append(head,sub);nav.append(group)});
    function fitFrame(frame,scale){frame.addEventListener('load',()=>{try{frame.contentDocument.documentElement.style.zoom=scale}catch(e){}})}
    function render(){const id=location.hash.slice(1)||'home',item=pages.find(x=>x[0]===id)||pages[0];title.textContent=item[1];document.querySelectorAll('.nav-link').forEach(x=>x.classList.toggle('active',x.dataset.id===item[0]));document.body.classList.remove('menu-open');
      document.querySelectorAll('.nav-group').forEach(g=>{if(g.querySelector(`[data-id="${item[0]}"]`) && item[0]!==g.querySelector('.nav-group-head .nav-link').dataset.id)g.classList.remove('collapsed')});
      if(item[0]==='gifting'){
        const commonDesc='เมื่อซื้อแพ็กเกจนี้ คุณจะได้รับบัตรของขวัญ (Gift Card) ที่มีมูลค่าเท่ากับราคาของสถานะ Supporter รวมภาษีที่เกี่ยวข้อง บัตรของขวัญนี้ไม่ได้จำกัดการใช้งานเฉพาะสถานะ Supporter เท่านั้น แต่สามารถนำไปใช้ซื้อสินค้าหรือบริการใดก็ได้ในร้านค้าออนไลน์ของเรา ซึ่งช่วยให้คุณสามารถมอบสถานะดังกล่าวเป็นของขวัญให้เพื่อน หรือช่วยลดราคาสำหรับการซื้อสถานะที่มีราคาสูงกว่าได้หากคุณต้องการมอบสถานะ Supporter เป็นของขวัญ เพียงแค่ซื้อบัตรของขวัญที่มีมูลค่าตรงกับราคาของสถานะที่ต้องการมอบให้ หลังจากชำระเงินเสร็จสิ้น รหัสบัตรของขวัญจะถูกส่งไปยังอีเมลของคุณ ผู้รับสามารถนำรหัสนี้ไปกรอกในช่อง Coupon / Gift Card ระหว่างขั้นตอนการชำระเงินเมื่อซื้อสถานะ Supporter ได้โปรดทราบว่าการซื้อแพ็กเกจนี้ไม่ได้ทำให้คุณได้รับสิทธิ์เข้าถึงเซิร์ฟเวอร์ (Whitelist) และไม่ได้เพิ่มลำดับความสำคัญในการรอคิวเข้าเซิร์ฟเวอร์แต่อย่างใด แพ็กเกจนี้เป็นเพียงการสร้างรหัสบัตรของขวัญสำหรับใช้ในร้านค้าออนไลน์ของเราเท่านั้นรายได้ทั้งหมดจะถูกนำไปใช้พัฒนาเซิร์ฟเวอร์ต่อ เช่น การจัดหาสคริปต์ การจ้างนักพัฒนา การปรับปรุงระบบอย่างต่อเนื่อง และการสนับสนุนทีมงาน บัตรของขวัญไม่สามารถขอคืนเงินได้ หากมีการทำเรื่องขอคืนเงินผ่านธนาคารหรือผู้ให้บริการชำระเงิน (Chargeback) หลังจากซื้อบัตรของขวัญไปแล้ว เราขอสงวนสิทธิ์ในการระงับบัญชีของคุณจากการเป็นส่วนหนึ่งของชุมชนนี้';
        const gifts=[
          {team:'Early Supporter',title:'Early Supporter',price:'20',status:'On Sale',statusBg:'#e0be6f',statusInk:'#241a0f',image:'https://i.postimg.cc/JzjSsnfw/New-Project-(6).png',coming:false,
            description:'ผู้สนับสนุนช่วงแรกจะได้รับบทบาท Discord "Early Supporter" และสิทธิ์คิวลำดับความสำคัญระดับ Diamond เป็นเวลา 2 เดือนแพ็กเกจนี้จะไม่สามารถซื้อได้อีกหลังจากเซิร์ฟเวอร์เปิดให้บริการ**สิ่งนี้ไม่ได้ให้สิทธิ์ WHITELIST เพื่อเข้าเซิร์ฟเวอร์** - จะเป็นเพียงการเพิ่มลำดับความสำคัญในคิวของคุณ และมอบบทบาทใน Discord เท่านั้นรายได้ทั้งหมดจะถูกนำกลับไปลงทุนในเซิร์ฟเวอร์ ได้แก่ การสนับสนุนสคริปต์ การว่าจ้างนักพัฒนา การปรับปรุงอย่างต่อเนื่อง และการสนับสนุนทีมงานหากมีการขอคืนเงิน สิทธิ์ลำดับความสำคัญในคิวจะถูกยกเลิกหากคุณดำเนินการเรียกเงินคืนผ่านผู้ให้บริการชำระเงิน (chargeback) เราขอสงวนสิทธิ์ในการแบนคุณออกจากชุมชน'},
          {team:'Iron Gift',title:'Iron Gift',price:'0',status:'Coming Soon',statusBg:'#E4E1D8',statusInk:'#241a0f',image:'https://img1.pic.in.th/images/1158b637a565d663b.png',coming:true,description:commonDesc},
          {team:'Silver Gift',title:'Silver Gift',price:'0',status:'Coming Soon',statusBg:'#E4E1D8',statusInk:'#241a0f',image:'https://img2.pic.in.th/2b28386f7faecbfe0.png',coming:true,description:commonDesc},
          {team:'Gold Gift',title:'Gold Gift',price:'0',status:'Coming Soon',statusBg:'#E4E1D8',statusInk:'#241a0f',image:'https://img2.pic.in.th/39ad6501a5825059b.png',coming:true,description:commonDesc},
          {team:'Platinum Gift',title:'Platinum Gift',price:'0',status:'Coming Soon',statusBg:'#E4E1D8',statusInk:'#241a0f',image:'https://img1.pic.in.th/images/4a75496ac5c40f503.png',coming:true,description:commonDesc},
          {team:'Diamond Gift',title:'Diamond Gift',price:'0',status:'Coming Soon',statusBg:'#E4E1D8',statusInk:'#241a0f',image:'https://img2.pic.in.th/50aa6f1c8f193fddd.png',coming:true,description:commonDesc}
        ];
        content.innerHTML=`<section class="gift-page"><header class="gift-head"><h1>GIFTING</h1><small>MEDIEVAL ONLINE RP · THAILAND</small><div class="gift-info"><h2>Medieval Online Thai</h2><p>การสนับสนุนเซิร์ฟเวอร์ช่วยให้เราพัฒนาเนื้อหา ระบบ และชุมชนให้ดียิ่งขึ้น สินค้าเป็นดิจิทัล จึงไม่สามารถขอคืนเงินได้ หากมีข้อสงสัย โปรดติดต่อทีมงานผ่าน Discord</p><a class="gift-discord" href="https://discord.gg/BXHrfDTGvV" target="_blank" rel="noopener">เข้าร่วม Discord</a></div></header><h2 class="ticket-title">GIFT TICKETS</h2><div class="tk-grid">${gifts.map((g,i)=>`<div class="tk-card ${g.coming?'coming':''}"><span class="tk-gem tl"></span><span class="tk-gem tr"></span><span class="tk-gem bl"></span><span class="tk-gem br"></span><div class="tk-media"><div class="tk-media-inner"><img src="${g.image}" alt="${g.title}" onerror="this.src='https://placehold.co/400x300/2b2015/e0be6f?text=Gift'"></div><span class="tk-status" style="background:linear-gradient(180deg,${g.statusBg},#8a6520);color:${g.statusInk}">${g.status}</span></div><div class="tk-tear"></div><div class="tk-body"><div class="tk-team-row"><div class="tk-badge">${g.team.trim().charAt(0).toUpperCase()}</div><div class="tk-team">${g.team}</div></div><div class="tk-title">${g.title}</div><div class="tk-price"><span class="cur">$</span>${g.price}</div><div class="tk-actions">${g.coming?`<span class="tk-buy" aria-disabled="true">BUY</span>`:`<a class="tk-buy" href="https://medieval-rp-thai.tebex.store" target="_blank" rel="noopener">BUY<svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`}<button class="tk-outline" data-idx="${i}">ดูรายละเอียด</button></div></div></div>`).join('')}</div></section><div class="tk-overlay" id="tkOverlay"><div class="tk-modal-frame"><span class="tk-gem tl"></span><span class="tk-gem tr"></span><span class="tk-gem bl"></span><span class="tk-gem br"></spa         const tkOverlay=document.getElementById('tkOverlay');
        content.querySelectorAll('.tk-outline[data-idx]').forEach(btn=>{
          btn.addEventListener('click',()=>{
            const g=gifts[+btn.dataset.idx];
            document.getElementById('tkModalTeam').textContent=g.team;
            document.getElementById('tkModalTitle').textContent=g.title;
            document.getElementById('tkModalPrice').innerHTML='<span class="cur">$</span>'+g.price;
            document.getElementById('tkModalDesc').textContent=g.description;
            tkOverlay.classList.add('open');
          });
        });
        document.getElementById('tkModalClose').addEventListener('click',()=>tkOverlay.classList.remove('open'));
        tkOverlay.addEventListener('click',(e)=>{if(e.target===tkOverlay)tkOverlay.classList.remove('open');});
      }
      else {content.innerHTML=`<iframe class="page-frame" title="${item[1]}" src="${item[2]}"></iframe>`;fitFrame(content.querySelector('.page-frame'),'.86')}
    }window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu-open');render();
