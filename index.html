<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171009">
  <title>Medieval Online RP Thailand</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap');
    :root{--bg:#171009;--side:#21170d;--edge:#745329;--gold:#e2bd6b;--text:#f0dfbc;--muted:#bd9c62}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:'Noto Serif Thai',serif;background:var(--bg);color:var(--text);overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:280px 1fr}
    aside{background:linear-gradient(180deg,#2b1d0f,#171009);border-right:1px solid var(--edge);overflow-y:auto;padding:26px 15px 30px}
    .brand{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);font-weight:700;letter-spacing:.06em;text-align:center;font-size:1.18rem;padding:0 8px 22px;border-bottom:1px solid rgba(226,189,107,.35);margin-bottom:16px}.brand small{display:block;font-family:'Noto Serif Thai',serif;color:var(--muted);font-weight:400;font-size:.72rem;letter-spacing:.12em;margin-top:5px}
    nav{display:flex;flex-direction:column;gap:4px}.nav-link{width:100%;border:0;border-left:3px solid transparent;background:transparent;color:#dfcda8;text-align:left;padding:11px 12px;font:500 .9rem 'Noto Serif Thai',serif;cursor:pointer;border-radius:0 5px 5px 0;transition:.18s}.nav-link:hover,.nav-link.active{background:rgba(201,163,92,.16);border-left-color:var(--gold);color:#fff}.sub{font-size:.82rem;padding-left:28px;color:#c7ad7b}.group{font:600 .7rem Cinzel,'Noto Serif Thai',serif;color:var(--muted);letter-spacing:.08em;padding:15px 12px 3px}
    main{min-width:0;position:relative;background:#111}.topbar{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(90deg,#23180d,#181108);border-bottom:1px solid var(--edge);color:var(--gold);font-family:Cinzel,'Noto Serif Thai',serif;font-size:.93rem;letter-spacing:.04em}.menu{display:none;background:none;border:1px solid var(--edge);color:var(--gold);font-size:1.25rem;border-radius:4px;padding:3px 9px;cursor:pointer}.content{height:calc(100% - 56px);overflow:auto;background:#16100a}.page-frame{width:100%;height:100%;border:0;display:block;background:#16100a}.gifting{min-height:100%;padding:22px;background:radial-gradient(1000px 500px at 10% 0,#3a2715 0,transparent 65%),#171009}.gifting-intro{height:min(720px,75vh);width:100%;border:0;background:#171009;display:block;border-radius:8px}.ticket-title{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);text-align:center;letter-spacing:.08em;margin:35px 0 18px}.tickets{max-width:1220px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}.ticket{height:520px;border:1px solid var(--edge);border-radius:8px;background:#171009}
    @media(max-width:760px){body{overflow:auto}.app{display:block}.menu{display:block}aside{position:fixed;z-index:5;left:0;top:0;bottom:0;width:280px;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px #000}body.menu-open aside{transform:translateX(0)}main{height:100vh}.topbar{height:52px}.content{height:calc(100vh - 52px)}.gifting{padding:10px}.gifting-intro{height:650px}.ticket{height:500px}}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"><div class="brand">MEDIEVAL ONLINE<small>ROLEPLAY THAILAND</small></div><nav id="navigation"></nav></aside>
    <main><div class="topbar"><button class="menu" id="menu" aria-label="เปิดเมนู">☰</button><span id="pageTitle">HOME</span></div><div class="content" id="content"></div></main>
  </div>
  <script>
    const pages=[
      ['home','HOME','HOME.html'],['about','ABOUT','ABOUT.html'],['rules','RULES','RULES.html'],
      ['lore','SERVER LORE','SERVER LORE.html'],['ep1','เนื้อเรื่อง EP.1','EP1.html','sub'],['ep2','เนื้อเรื่อง EP.2','EP2.html','sub'],['ep3','เนื้อเรื่อง EP.3','EP3.html','sub'],
      ['guide','GUIDE','GUIDE.html'],['legend','เรื่องเล่า ตำนาน','เรื่องเล่า ตำนาน.html','sub'],['roles','บทบาท','บทบาท.html','sub'],
      ['whitelist','Whitelist Registration','Whitelist Registration.html'],['gifting','GIFTING','GIFTING.html']
    ];
    const nav=document.getElementById('navigation'),content=document.getElementById('content'),title=document.getElementById('pageTitle');
    pages.forEach(([id,label,file,kind])=>{const b=document.createElement('button');b.className='nav-link '+(kind||'');b.dataset.id=id;b.textContent=label;b.onclick=()=>location.hash=id;nav.append(b)});
    function render(){const id=location.hash.slice(1)||'home',item=pages.find(x=>x[0]===id)||pages[0];title.textContent=item[1];document.querySelectorAll('.nav-link').forEach(x=>x.classList.toggle('active',x.dataset.id===item[0]));document.body.classList.remove('menu-open');
      if(item[0]==='gifting')content.innerHTML=`<section class="gifting"><iframe class="gifting-intro" title="GIFTING" src="${item[2]}"></iframe><h2 class="ticket-title">GIFT TICKETS</h2><div class="tickets">${['IronGift','SilverGift','GoldGift','PlatinumGift','DiamondGift','EarlySupporter'].map(n=>`<iframe class="ticket" title="${n}" src="ticket/${n}.html"></iframe>`).join('')}</div></section>`;
      else content.innerHTML=`<iframe class="page-frame" title="${item[1]}" src="${item[2]}"></iframe>`;
    }window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu-open');render();
  </script>
</body>
</html>
